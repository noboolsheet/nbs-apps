server {
    listen 80;
    server_name _;

    # --- 1. SERVER HARDENING ---
    # Hide Nginx version number in error pages and headers
    server_tokens off;
    
    # Limit request body size to prevent large file upload attacks
    # Adjust this if you plan to upload large images/files
    client_max_body_size 5M;

    root /usr/share/nginx/html;
    index index.html;

    # --- 3. GZIP COMPRESSION ---
    gzip on;
    gzip_proxied any; # Compress for proxied requests too
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # --- 4. STATIC ASSET CACHING ---
    # Todo lo de /_next/static/ lleva hash de contenido en el nombre (Next lo
    # garantiza), así que es seguro cachearlo para siempre. `^~` hace que este
    # prefijo gane a las reglas regex de abajo, de modo que los .woff2/.css/.js
    # de Next reciban `immutable` y no la regla de medios con TTL finito.
    # (Antes había una regla regex `\.[0-9a-f]{8,}\.ext` que NO matcheaba los
    # nombres reales de los chunks de Next → se servían sin Cache-Control.)
    location ^~ /_next/static/ {
        expires max;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(html|json|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Media/fuentes sin hash en el nombre (p. ej. /images/logo-unilp.webp).
    # Caerían al `location /` sin Cache-Control y se revalidarían en cada visita.
    # TTL finito (no `immutable`) porque al no llevar hash pueden reemplazarse.
    # Un solo `add_header` (sin `expires`) para no emitir Cache-Control duplicado.
    location ~* \.(webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # --- 5. SPA FALLBACK ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 6. ADVANCED SECURITY HEADERS ---
    # Prevents clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevents browsers from guessing MIME types (stops script injection)
    add_header X-Content-Type-Options "nosniff" always;

    # Controls how much referrer info is shared
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Force HTTPS for one year (only effective when site is served over HTTPS;
    # assumes TLS termination at an upstream proxy/load balancer).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy
    # - script-src 'unsafe-inline': required for the inline JSON-LD <script> in layout.tsx.
    # - style-src includes Google Fonts origin defensively (next/font self-hosts at build time).
    # - frame-src allows Google Maps embed used in components/map-section.tsx.
    # - img-src https: lets remote partner/logo images load when needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https://www.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.google.com https://maps.google.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;

    # Enable XSS protection in older browsers
    add_header X-XSS-Protection "1; mode=block";
}