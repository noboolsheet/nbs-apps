name: stack-site-utcs-${DOCKER_PROFILE}

# utcs es una app SSR (TanStack Start + Nitro node-server). A diferencia de
# unilp (export estatico via nginx + backend aparte), aqui un unico
# contenedor Node sirve el frontend Y maneja el formulario de contacto via
# server functions, asi que no hay servicio backend separado.
services:
  frontend:
    container_name: ${DOCKER_UTCS_APP_DDNS}.${DOCKER_PROFILE}
    build:
      context: .
      dockerfile: ./Dockerfile
      # Demo estatica de portafolio: chatbot desactivado (el widget no se renderiza).
      args:
        VITE_CHAT_ENABLED: "false"
    restart: unless-stopped
    ports:
      - "${UTCS_APP_IFACE}:${UTCS_APP_EPORT}:${UTCS_APP_IPORT}"
    environment:
      - NODE_ENV=production
      - PORT=${UTCS_APP_IPORT}
      - HOST=0.0.0.0
      # Sin SMTP ni webhook de n8n: los formularios de la demo no envian nada
      # (ver src/lib/api/*: quedan inertes).
    # Healthcheck: pega al server dentro del contenedor. Si el bind quedo mal,
    # el contenedor aparece 'unhealthy' en docker ps en vez de un 'Up' enganoso.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${UTCS_APP_IPORT}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - custom_net_ref

networks:
  custom_net_ref:
    name: ${DOCKER_NETWORK}
    external: true
