name: stack-site-control-tower-${DOCKER_PROFILE}

# Control Tower (prod): web (Next.js) + worker (Node) + control-tower-db (Postgres 18).
# Modelo-1 del monorepo: red externa compartida noboolsheet_network, envs/ y Caddy.
# Secretos (BETTER_AUTH_SECRET, *_API_KEY) desde control-tower/.env gitignored.

services:
  web:
    container_name: ${DOCKER_CONTROL_TOWER_APP_DDNS}.${DOCKER_PROFILE}
    build:
      context: .
      dockerfile: ./Dockerfile
      target: web
    restart: unless-stopped
    # Techo de memoria (F-31). Valores medidos en local con ~2x de holgura
    # (web: 247→289 MB navegando); ajustables desde el .env del perfil.
    # Requiere que el kernel del host tenga activo el cgroup de memoria: si no,
    # Docker avisa, DESCARTA el límite y arranca sin techo. Comprobar con:
    #   grep memory /sys/fs/cgroup/cgroup.controllers
    # Contexto completo y la batalla con Raspberry Pi OS: docs/FINDINGS_AND_DEFERRED.md § F-31.
    mem_limit: ${CONTROL_TOWER_MEM_WEB:-768m}
    # Rotación del log de Docker: sin esto el json-file crece SIN LÍMITE y acaba llenando el disco del servidor
    # (el worker escribe en cada tick). 10 MB × 3 ficheros = 30 MB como mucho por servicio.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - '${CONTROL_TOWER_APP_IFACE}:${CONTROL_TOWER_APP_EPORT}:${CONTROL_TOWER_APP_IPORT}'
    env_file:
      - ./.env.${DOCKER_PROFILE}
    environment:
      - NODE_ENV=production
      - PORT=${CONTROL_TOWER_APP_IPORT}
      # DATABASE_URL se construye de POSTGRES_* (en apps/control-tower/.env; los carga el deploy script).
      # Los `:?` ABORTAN con error claro si faltan, en vez de generar una URL rota silenciosa (usuario vacío → "root").
      - DATABASE_URL=postgres://${POSTGRES_USER:?falta POSTGRES_USER — despliega con ./deploy-control-tower.sh prod}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@${DOCKER_CONTROL_TOWER_DB_DDNS}.${DOCKER_PROFILE}:5432/${POSTGRES_DB:?falta POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:${CONTROL_TOWER_APP_IPORT}/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - custom_net_ref

  worker:
    container_name: ${DOCKER_CONTROL_TOWER_WORKER_DDNS}.${DOCKER_PROFILE}
    build:
      context: .
      dockerfile: ./Dockerfile
      target: worker
    restart: unless-stopped
    # Techo de memoria (F-31). Valores medidos en local con ~2x de holgura
    # (worker: ~50 MB en reposo + los lotes de sync); ajustables desde el .env del perfil.
    # Requiere que el kernel del host tenga activo el cgroup de memoria: si no,
    # Docker avisa, DESCARTA el límite y arranca sin techo. Comprobar con:
    #   grep memory /sys/fs/cgroup/cgroup.controllers
    # Contexto completo y la batalla con Raspberry Pi OS: docs/FINDINGS_AND_DEFERRED.md § F-31.
    mem_limit: ${CONTROL_TOWER_MEM_WORKER:-512m}
    # Rotación del log de Docker: sin esto el json-file crece SIN LÍMITE y acaba llenando el disco del servidor
    # (el worker escribe en cada tick). 10 MB × 3 ficheros = 30 MB como mucho por servicio.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ./.env.${DOCKER_PROFILE}
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:?falta POSTGRES_USER — despliega con ./deploy-control-tower.sh prod}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@${DOCKER_CONTROL_TOWER_DB_DDNS}.${DOCKER_PROFILE}:5432/${POSTGRES_DB:?falta POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    # Liveness por heartbeat: el worker escribe /tmp/ct-worker-heartbeat al terminar cada tick; se marca unhealthy
    # si lleva >5 min sin latir. (El reinicio real ante cuelgue lo hace el watchdog interno del worker → exit(1) +
    # `restart: unless-stopped`; este healthcheck es para observabilidad en `docker ps`.)
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('fs');try{const m=fs.statSync(process.env.WORKER_HEARTBEAT_FILE||'/tmp/ct-worker-heartbeat').mtimeMs;process.exit(Date.now()-m<300000?0:1)}catch{process.exit(1)}",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - custom_net_ref

  db:
    image: postgres:18
    container_name: ${DOCKER_CONTROL_TOWER_DB_DDNS}.${DOCKER_PROFILE}
    restart: unless-stopped
    # Techo de memoria (F-31). Valores medidos en local con ~2x de holgura
    # (db: 72 MB en reposo); ajustables desde el .env del perfil.
    # Requiere que el kernel del host tenga activo el cgroup de memoria: si no,
    # Docker avisa, DESCARTA el límite y arranca sin techo. Comprobar con:
    #   grep memory /sys/fs/cgroup/cgroup.controllers
    # Contexto completo y la batalla con Raspberry Pi OS: docs/FINDINGS_AND_DEFERRED.md § F-31.
    mem_limit: ${CONTROL_TOWER_MEM_DB:-512m}
    # Rotación del log de Docker: sin esto el json-file crece SIN LÍMITE y acaba llenando el disco del servidor
    # (el worker escribe en cada tick). 10 MB × 3 ficheros = 30 MB como mucho por servicio.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Guardas `:?` para no crear NUNCA la DB con credenciales vacías (protege también los datos existentes).
      - POSTGRES_USER=${POSTGRES_USER:?falta POSTGRES_USER — despliega con ./deploy-control-tower.sh prod}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:?falta POSTGRES_DB}
    # Persistencia: bind-mount al host (patrón twenty-db). El dir lo crea deploy-control-tower.sh.
    volumes:
      - ${CONTROL_TOWER_DATA_DIR}:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - custom_net_ref

networks:
  custom_net_ref:
    name: ${DOCKER_NETWORK}
    external: true
