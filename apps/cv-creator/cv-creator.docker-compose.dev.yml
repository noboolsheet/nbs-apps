name: stack-site-cv-creator-${DOCKER_PROFILE}

# cv-creator: Creador de CV con IA. Un unico contenedor Express sirve el build
# (SPA) Y la API /api/parse-cv (Gemini). En dev se accede directo por
# http://localhost:${CV_CREATOR_APP_EPORT} (sin Caddy).
services:
  frontend:
    container_name: ${DOCKER_CV_CREATOR_APP_DDNS}.${DOCKER_PROFILE}
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - "${CV_CREATOR_APP_IFACE}:${CV_CREATOR_APP_EPORT}:${CV_CREATOR_APP_IPORT}"
    # Secretos (GEMINI_API_KEY) y opciones (ALLOW_REGISTRATION) desde cv-creator/.env, gitignored.
    env_file:
      - ./.env.${DOCKER_PROFILE}
    environment:
      - NODE_ENV=production
      - PORT=${CV_CREATOR_APP_IPORT}
      - DATA_DIR=/app/data
    # Persistencia: BD SQLite (usuarios + CVs) en un VOLUMEN Docker con nombre. En dev
    # se usa volumen con nombre (no bind-mount a /opt) para que funcione igual en
    # Mac/Docker Desktop sin configurar File Sharing. En prod es un bind-mount a /opt.
    volumes:
      - cv_creator_data_dev:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${CV_CREATOR_APP_IPORT}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - custom_net_ref

networks:
  custom_net_ref:
    name: ${DOCKER_NETWORK}
    external: true

volumes:
  cv_creator_data_dev:
